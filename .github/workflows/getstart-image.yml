name: Docker Image CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v6
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}       # Username must be lowercase
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the Image
        uses: docker/build-push-action@v7
        with:
            context: .
            push: true
            tags: |
              ghcr.io/${{ github.actor }}/getting-started:latest
              ghcr.io/${{ github.actor }}/getting-started:${{ github.sha }}

